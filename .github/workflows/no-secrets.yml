# Fails if this repo can see any provider API key. Keys must only be set in the repos that
# call the reusable workflow, never here (repo secrets, or org secrets shared with this repo).

name: No API keys in this repo

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches secrets added without a push

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          found=0
          for s in ANTHROPIC OPENAI GEMINI; do
            var="HAS_${s}_KEY"
            if [[ "${!var}" == true ]]; then
              echo "::error::${s}_API_KEY is visible to this repo. Delete it here (or from the org) and set it only in calling repos."
              found=1
            fi
          done
          exit "$found"
