# Reusable multi-agent security review.
# Claude Code and Codex each review the calling repo in parallel and open
# their own PR with fixes + a findings report.
#
# Call it from another repo (see examples/caller.yml):
#   uses: shaztechio/multi-llm-security-review/.github/workflows/security-review.yml@main
#
# The caller must grant:  permissions: { contents: write, pull-requests: write }
# plus { security-events: write, actions: read } when upload-sarif is on (the default).
# and enable Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
#
# API keys (ANTHROPIC_API_KEY / OPENAI_API_KEY / OPENROUTER_API_KEY) are secrets of the CALLING repo only.
# The run fails if a selected provider has no key, or if it is run from this repo itself.

name: Security review (reusable)

on:
  workflow_call:
    inputs:
      anthropic:
        description: "Run Anthropic (Claude Code)"
        type: boolean
        default: true
      openai:
        description: "Run OpenAI (Codex)"
        type: boolean
        default: true
      openrouter:
        description: "Run an OpenRouter model (via Claude Code); needs openrouter-model. Experimental."
        type: boolean
        default: false
      openrouter-model:
        description: "OpenRouter model slug, e.g. vendor/model (required when openrouter is on)"
        type: string
        default: ""
      draft:
        description: "Open PRs as drafts"
        type: boolean
        default: true
      upload-sarif:
        description: "Upload findings to code scanning (Security tab). Private repos need GitHub Code Security."
        type: boolean
        default: true
      base-branch:
        description: "Branch to review (default: the repo's default branch)"
        type: string
        default: ""
      claude-model:
        type: string
        default: ""
      codex-model:
        type: string
        default: ""
      codex-effort:
        description: "Codex reasoning effort (low/medium/high/xhigh); blank = Codex default"
        type: string
        default: "medium"
      agent-timeout-minutes:
        description: "Kill an agent after this many minutes (keep under 105)"
        type: number
        default: 60
      tool-repository:
        description: "Repo holding scripts/security-review.mjs"
        type: string
        default: shaztechio/multi-llm-security-review
      tool-ref:
        description: "Ref of tool-repository to use; pin this to the same ref as the uses: line"
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.pick.outputs.agents }}
    steps:
      - id: pick
        env:
          ANTHROPIC: ${{ inputs.anthropic }}
          OPENAI: ${{ inputs.openai }}
          OPENROUTER: ${{ inputs.openrouter }}
          OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          # API keys belong to the calling repo only; this repo must never hold them or run itself.
          if [[ "$GITHUB_REPOSITORY" == "shaztechio/multi-llm-security-review" ]]; then
            echo "::error::This workflow must be called from another repo, with the API keys set as that repo's secrets."
            exit 1
          fi
          agents=() missing=()
          pick() { # $1 selected, $2 has key, $3 agent, $4 secret name
            [[ "$1" == true ]] || return 0
            if [[ "$2" == true ]]; then agents+=("$3"); else missing+=("$4"); fi
          }
          pick "$ANTHROPIC" "$HAS_ANTHROPIC_KEY" claude ANTHROPIC_API_KEY
          pick "$OPENAI"    "$HAS_OPENAI_KEY"    codex  OPENAI_API_KEY
          if [[ "$OPENROUTER" == true && -z "$OPENROUTER_MODEL" ]]; then
            echo "::error::openrouter is ticked but openrouter-model is empty."
            exit 1
          fi
          pick "$OPENROUTER" "$HAS_OPENROUTER_KEY" openrouter OPENROUTER_API_KEY
          if [[ ${#missing[@]} -gt 0 ]]; then
            for s in "${missing[@]}"; do
              echo "::error::$s is not set. Add it as a secret in $GITHUB_REPOSITORY and pass it (secrets: inherit), or untick that provider."
            done
            exit 1
          fi
          if [[ ${#agents[@]} -eq 0 ]]; then
            echo "::error::No provider selected."
            exit 1
          fi
          echo "agents=$(printf '%s\n' "${agents[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  review:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120 # hard ceiling; agent-timeout-minutes is the per-agent limit
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.agents) }}
    steps:
      - name: Check out repo under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out security-review tool
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          path: .security-review-tool # inside the workspace (required); agents work in separate worktrees, so it never lands in a PR
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ${{ matrix.agent }} CLI
        run: |
          case "${{ matrix.agent }}" in
            claude|openrouter) npm install -g @anthropic-ai/claude-code ;;
            codex)  ;; # installed by openai/codex-action
          esac

      # Codex runs through openai/codex-action instead of the CLI: the action sets up the
      # runner's user-namespace sandbox and drops sudo before running Codex, and keeps the
      # API key out of Codex's environment. It reviews a detached worktree of the base branch;
      # the script then publishes that worktree's output (PREPARED_CODEX_WORKTREE below).
      - name: Prepare Codex worktree and prompt
        if: ${{ matrix.agent == 'codex' }}
        env:
          BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
        run: |
          git fetch --quiet origin
          git worktree add --quiet --detach "$RUNNER_TEMP/codex-wt" "origin/$BASE_BRANCH"
          node .security-review-tool/scripts/security-review.mjs --print-prompt > "$RUNNER_TEMP/codex-prompt.md"

      - name: Run Codex review
        if: ${{ matrix.agent == 'codex' }}
        timeout-minutes: ${{ inputs.agent-timeout-minutes }}
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11; v1.12 hangs after the turn ends (codex-action#150)
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          working-directory: ${{ runner.temp }}/codex-wt
          permission-profile: ":workspace"
          model: ${{ inputs.codex-model }}
          effort: ${{ inputs.codex-effort }}
          # Compact history early so no single request nears the org's tokens-per-minute limit.
          codex-args: '["-c", "model_auto_compact_token_limit=120000"]'
          safety-strategy: drop-sudo

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run security review
        env:
          AGENTS: ${{ matrix.agent }}
          BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
          DRAFT: ${{ inputs.draft && '1' || '0' }}
          AGENT_TIMEOUT_MIN: ${{ inputs.agent-timeout-minutes }}
          TMPDIR: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ matrix.agent == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          # OPENAI_API_KEY is only given to openai/codex-action above, never to this step
          CLAUDE_MODEL: ${{ inputs.claude-model }}
          CODEX_MODEL:  ${{ inputs.codex-model }}
          OPENROUTER_API_KEY: ${{ matrix.agent == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
          SARIF_DIR: ${{ runner.temp }}/sarif
          PREPARED_CODEX_WORKTREE: ${{ matrix.agent == 'codex' && format('{0}/codex-wt', runner.temp) || '' }}
        shell: bash # implies -o pipefail, so a failing script fails the job despite tee
        run: node .security-review-tool/scripts/security-review.mjs . 2>&1 | tee "$RUNNER_TEMP/review-output.txt"

      # Findings are analysed against origin/<base>, so attach the alerts to that branch and commit.
      - name: Find SARIF
        id: sarif
        if: ${{ !cancelled() && inputs.upload-sarif }}
        env:
          BASE_BRANCH: ${{ inputs.base-branch || github.event.repository.default_branch }}
          SARIF_FILE: ${{ runner.temp }}/sarif/${{ matrix.agent }}.sarif
        run: |
          if [[ -s "$SARIF_FILE" ]]; then
            { echo "found=true"
              echo "file=$SARIF_FILE"
              echo "ref=refs/heads/$BASE_BRANCH"
              echo "sha=$(git rev-parse "origin/$BASE_BRANCH")"; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.agent }} wrote no SARIF; nothing to upload to code scanning."
          fi

      - name: Upload findings to code scanning
        if: ${{ !cancelled() && steps.sarif.outputs.found == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sarif.outputs.file }}
          category: security-review-${{ matrix.agent }}
          ref: ${{ steps.sarif.outputs.ref }}
          sha: ${{ steps.sarif.outputs.sha }}

      - name: Upload agent log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-${{ matrix.agent }}-log
          path: |
            ${{ runner.temp }}/review-output.txt
            ${{ runner.temp }}/secreview-*/*.log
          if-no-files-found: ignore
          retention-days: 14
